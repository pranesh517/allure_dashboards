name: 'Allure Traceability Matrix'
description: 'Optional companion to Allure Dashboard: turns Allure raw results (plus an optional requirements-file) into a static requirements traceability matrix on GitHub Pages. Not used unless you add this as its own step.'
author: 'pranesh517'
branding:
  icon: 'check-square'
  color: 'blue'

inputs:
  allure-results-path:
    description: 'Path to the allure-results directory produced by your test run (the raw *-result.json files, before `allure generate`).'
    required: true
  requirement-annotation:
    description: 'The name that identifies a requirement id, matched against label names and link types depending on requirement-source (e.g. "requirement", "issue", "tms", "tag").'
    required: true
  requirement-source:
    description: 'Where to look for requirement-annotation: auto (labels and links, unioned), label, link, or tag (the Allure `tag` label, filtered by requirement-id-pattern).'
    required: false
    default: 'auto'
  requirement-id-pattern:
    description: 'Regex an annotation value must match to count as a requirement id. Values that do not match are ignored and listed in the Gaps tab. Matched case-insensitively unless given as /pattern/flags with your own flags. With requirement-source: tag, this is what selects which tags are requirement ids.'
    required: false
    default: ''
  testcase-annotation:
    description: 'The name that identifies a test case id (e.g. "testcase", "tms"). Left unset, or missing on a given test, falls back to that test''s fullName.'
    required: false
    default: ''
  testcase-source:
    description: 'Where to look for testcase-annotation: auto, label, link, or tag. Same semantics as requirement-source.'
    required: false
    default: 'auto'
  testcase-id-pattern:
    description: 'Regex a testcase-annotation value must match. Same semantics as requirement-id-pattern.'
    required: false
    default: ''
  requirements-file:
    description: 'Path to a CSV or JSON master list of expected requirements (columns/keys: id required; title, epic, feature, priority optional). Without this, coverage is measured against whichever requirement ids show up in the test results, and no requirement can be "not covered".'
    required: false
    default: ''
  output-path:
    description: 'Directory to write the generated traceability-matrix site into.'
    required: false
    default: 'traceability-report'
  dashboard-url:
    description: 'Base URL of an Allure Dashboard (pranesh517/allure_dashboards) site generated from the same run. When set, every test in the matrix links to that test in the dashboard.'
    required: false
    default: ''
  title:
    description: 'Title shown on the generated report.'
    required: false
    default: 'Traceability Matrix'
  min-coverage:
    description: 'Minimum requirement coverage percent (0-100). If set and coverage is lower, the step fails after writing the report.'
    required: false
    default: ''
  fail-on-uncovered:
    description: 'If true, fail the step when any requirement (from requirements-file) has zero tests.'
    required: false
    default: 'false'
  fail-on-failing:
    description: 'If true, fail the step when any requirement has a failing or broken linked test.'
    required: false
    default: 'false'

outputs:
  total-requirements:
    description: 'Total requirements in the matrix (requirements-file row count if given, else distinct requirement ids seen in results).'
    value: ${{ steps.process.outputs.total-requirements }}
  covered-requirements:
    description: 'Requirements with at least one linked test, of any status.'
    value: ${{ steps.process.outputs.covered-requirements }}
  uncovered-requirements:
    description: 'Requirements with no linked tests (0 unless requirements-file is given).'
    value: ${{ steps.process.outputs.uncovered-requirements }}
  failing-requirements:
    description: 'Requirements with at least one failing or broken linked test.'
    value: ${{ steps.process.outputs.failing-requirements }}
  coverage-percent:
    description: 'Percent of requirements with all linked tests passing.'
    value: ${{ steps.process.outputs.coverage-percent }}
  orphan-tests:
    description: 'Tests with no requirement id at all.'
    value: ${{ steps.process.outputs.orphan-tests }}
  site-path:
    description: 'Path to the generated static report (upload this with actions/upload-pages-artifact).'
    value: ${{ steps.process.outputs.site-path }}

runs:
  using: 'composite'
  steps:
    - name: Set up Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '20'

    - name: Generate traceability matrix
      id: process
      shell: bash
      # Inputs reach the script only as environment variables, never as
      # ${{ }} text spliced into it — a value such as a PR title or branch
      # name passed in as title must not run as shell.
      env:
        INPUT_ALLURE_RESULTS_PATH: ${{ inputs.allure-results-path }}
        INPUT_OUTPUT_PATH: ${{ inputs.output-path }}
        INPUT_REQUIREMENT_ANNOTATION: ${{ inputs.requirement-annotation }}
        INPUT_REQUIREMENT_SOURCE: ${{ inputs.requirement-source }}
        INPUT_REQUIREMENT_ID_PATTERN: ${{ inputs.requirement-id-pattern }}
        INPUT_TESTCASE_ANNOTATION: ${{ inputs.testcase-annotation }}
        INPUT_TESTCASE_SOURCE: ${{ inputs.testcase-source }}
        INPUT_TESTCASE_ID_PATTERN: ${{ inputs.testcase-id-pattern }}
        INPUT_REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
        INPUT_DASHBOARD_URL: ${{ inputs.dashboard-url }}
        INPUT_TITLE: ${{ inputs.title }}
        INPUT_MIN_COVERAGE: ${{ inputs.min-coverage }}
        INPUT_FAIL_ON_UNCOVERED: ${{ inputs.fail-on-uncovered }}
        INPUT_FAIL_ON_FAILING: ${{ inputs.fail-on-failing }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        node "$ACTION_PATH/src/process.mjs" \
          --results "$INPUT_ALLURE_RESULTS_PATH" \
          --output "$INPUT_OUTPUT_PATH" \
          --requirement-annotation "$INPUT_REQUIREMENT_ANNOTATION" \
          --requirement-source "$INPUT_REQUIREMENT_SOURCE" \
          --requirement-id-pattern "$INPUT_REQUIREMENT_ID_PATTERN" \
          --testcase-annotation "$INPUT_TESTCASE_ANNOTATION" \
          --testcase-source "$INPUT_TESTCASE_SOURCE" \
          --testcase-id-pattern "$INPUT_TESTCASE_ID_PATTERN" \
          --requirements-file "$INPUT_REQUIREMENTS_FILE" \
          --dashboard-url "$INPUT_DASHBOARD_URL" \
          --title "$INPUT_TITLE" \
          --min-coverage "$INPUT_MIN_COVERAGE" \
          --fail-on-uncovered "$INPUT_FAIL_ON_UNCOVERED" \
          --fail-on-failing "$INPUT_FAIL_ON_FAILING" \
          --site-template "$ACTION_PATH/site-template"
