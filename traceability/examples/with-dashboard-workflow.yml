# Runs the Allure Dashboard action and the Allure Traceability Matrix action
# together from one test run, and publishes both to the same GitHub Pages
# site: the dashboard at the site root, the traceability matrix at
# /traceability/. Each test in the matrix links back to its row in the
# dashboard (dashboard-url), and the dashboard's own trend history works the
# same as it would without the matrix (see the dashboard action's own
# examples/ for actions/cache vs. durable release-asset history options).
#
# Copy this to .github/workflows/allure-reports.yml, replace "Run tests",
# and set requirement-annotation (and requirements-file, if you use one) to
# match your tests — see the README and annotations-*.md in this folder.
name: Allure Dashboard + Traceability Matrix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # ---- 1. Run your tests here — must produce an allure-results/ dir ----
      - name: Run tests
        run: echo "replace this step with your real test command"
        # run: pytest --alluredir=allure-results

      # ---- 2. Predict this run's Pages URL ----
      # Needed up front so the matrix's test links point at the dashboard
      # before it's actually deployed. This is the default GitHub Pages URL
      # for a project (non-custom-domain) site — adjust if you use a custom
      # domain or an org/user root (<owner>.github.io) repo.
      - name: Compute Pages URL
        id: pages-url
        run: echo "url=https://${{ github.repository_owner }}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_OUTPUT"

      # ---- 3. Restore trend history for the dashboard (optional but recommended) ----
      - name: Restore dashboard history
        uses: actions/cache@v4
        with:
          path: dashboard-history
          key: allure-dashboard-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            allure-dashboard-history-${{ github.ref_name }}-

      # ---- 4. Build the dashboard ----
      - name: Generate Allure dashboard
        id: dashboard
        uses: pranesh517/allure_dashboards@v2
        with:
          allure-results-path: allure-results
          output-path: site
          history-path: dashboard-history
          dashboard-title: My Project — Test Dashboard

      - name: Save dashboard history
        run: |
          rm -rf dashboard-history
          cp -r site/data dashboard-history

      # ---- 5. Build the traceability matrix into a subfolder of the same site ----
      - name: Generate traceability matrix
        id: matrix
        uses: pranesh517/allure_dashboards/traceability@v2
        with:
          allure-results-path: allure-results
          output-path: site/traceability
          requirement-annotation: requirement
          requirements-file: requirements.csv
          dashboard-url: ${{ steps.pages-url.outputs.url }}
          title: My Project — Traceability Matrix

      # ---- 6. Publish both as one Pages site ----
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          echo "### Allure reports" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dashboard: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Traceability matrix: ${{ steps.deployment.outputs.page_url }}traceability/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Coverage: ${{ steps.matrix.outputs.coverage-percent }}% (${{ steps.matrix.outputs.covered-requirements }}/${{ steps.matrix.outputs.total-requirements }} requirements) · ${{ steps.matrix.outputs.orphan-tests }} orphan tests" >> "$GITHUB_STEP_SUMMARY"
