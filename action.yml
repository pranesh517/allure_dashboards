name: 'Allure Dashboard'
description: 'Turn Allure raw results into a creative, trend-aware static dashboard, ready to publish on GitHub Pages.'
author: 'pranesh517'
branding:
  icon: 'bar-chart-2'
  color: 'purple'

inputs:
  allure-results-path:
    description: 'Path to the allure-results directory produced by your test run (the raw *-result.json files, before `allure generate`).'
    required: true
  output-path:
    description: 'Directory to write the generated dashboard site into.'
    required: false
    default: 'allure-dashboard'
  history-path:
    description: 'Path to a previous data/ directory to merge trend history from (e.g. restored via actions/cache). Leave empty to start fresh history.'
    required: false
    default: ''
  run-id:
    description: 'Unique id for this run, used as the history key.'
    required: false
    default: ${{ github.run_id }}
  run-label:
    description: 'Human label for this run shown on the dashboard.'
    required: false
    default: ${{ github.run_number }}
  max-history:
    description: 'Maximum number of runs kept in the trend history.'
    required: false
    default: '100'
  dashboard-title:
    description: 'Title shown on the generated dashboard.'
    required: false
    default: 'Allure Dashboard'
  traceability-url:
    description: 'Base URL of an Allure Traceability Matrix site (pranesh517/allure_dashboards/traceability) generated from the same run. When set, shows a "Traceability" link in the dashboard header. Purely a link — leave empty if you are not using that action.'
    required: false
    default: ''
  job-summary:
    description: 'Write a summary of this run to the job summary page: pass rate and its change since the previous run in history, plus new failures, newly flaky and fixed tests (the comparison needs history-path). Set to "false" to turn it off.'
    required: false
    default: 'true'
  dashboard-url:
    description: 'Public URL of this dashboard (e.g. your GitHub Pages URL). When set, the job summary links to the dashboard and each listed test links to its row. Leave empty for a summary without links.'
    required: false
    default: ''

outputs:
  total:
    description: 'Total tests in this run'
    value: ${{ steps.process.outputs.total }}
  passed:
    description: 'Passed tests in this run'
    value: ${{ steps.process.outputs.passed }}
  failed:
    description: 'Failed tests in this run'
    value: ${{ steps.process.outputs.failed }}
  broken:
    description: 'Broken tests in this run'
    value: ${{ steps.process.outputs.broken }}
  skipped:
    description: 'Skipped tests in this run'
    value: ${{ steps.process.outputs.skipped }}
  pass-rate:
    description: 'Pass rate percentage (0-100) for this run'
    value: ${{ steps.process.outputs.pass-rate }}
  flaky-count:
    description: 'Number of tests flagged flaky in this run'
    value: ${{ steps.process.outputs.flaky-count }}
  site-path:
    description: 'Path to the generated static dashboard (upload this with actions/upload-pages-artifact)'
    value: ${{ steps.process.outputs.site-path }}

runs:
  using: 'composite'
  steps:
    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '20'

    - name: Generate Allure dashboard
      id: process
      shell: bash
      # Inputs reach the script only as environment variables, never as
      # ${{ }} text spliced into it — a value such as a PR title or branch
      # name passed in as dashboard-title / run-label must not run as shell.
      env:
        INPUT_ALLURE_RESULTS_PATH: ${{ inputs.allure-results-path }}
        INPUT_OUTPUT_PATH: ${{ inputs.output-path }}
        INPUT_HISTORY_PATH: ${{ inputs.history-path }}
        INPUT_RUN_ID: ${{ inputs.run-id }}
        INPUT_RUN_LABEL: ${{ inputs.run-label }}
        INPUT_MAX_HISTORY: ${{ inputs.max-history }}
        INPUT_DASHBOARD_TITLE: ${{ inputs.dashboard-title }}
        INPUT_TRACEABILITY_URL: ${{ inputs.traceability-url }}
        INPUT_JOB_SUMMARY: ${{ inputs.job-summary }}
        INPUT_DASHBOARD_URL: ${{ inputs.dashboard-url }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        node "$ACTION_PATH/src/process.mjs" \
          --results "$INPUT_ALLURE_RESULTS_PATH" \
          --output "$INPUT_OUTPUT_PATH" \
          --history "$INPUT_HISTORY_PATH" \
          --run-id "$INPUT_RUN_ID" \
          --run-label "$INPUT_RUN_LABEL" \
          --max-history "$INPUT_MAX_HISTORY" \
          --title "$INPUT_DASHBOARD_TITLE" \
          --traceability-url "$INPUT_TRACEABILITY_URL" \
          --job-summary "$INPUT_JOB_SUMMARY" \
          --dashboard-url "$INPUT_DASHBOARD_URL" \
          --site-template "$ACTION_PATH/site-template"
