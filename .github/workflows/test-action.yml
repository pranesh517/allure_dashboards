# Self-test: proves both actions in this repo work end to end for anyone who
# checks it out, by running each against its own bundled fixture and
# asserting the output. On pushes to main it also republishes the result as
# a live combined demo on this repo's own GitHub Pages: the dashboard at the
# site root, the traceability matrix at /traceability/, cross-linked.
name: Self-test & demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  self-test:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Run action against fixture run #1
        id: run1
        uses: ./
        with:
          allure-results-path: examples/sample-allure-results/run1
          output-path: allure-dashboard
          run-id: demo-run-1
          run-label: 'Demo Build #1'
          dashboard-title: 'Allure Dashboard — Live Demo'

      - name: Carry history forward
        run: |
          rm -rf demo-history
          cp -r allure-dashboard/data demo-history

      # Predicted ahead of the deploy (same technique as
      # traceability/examples/with-dashboard-workflow.yml) so both the
      # dashboard's traceability-url and the matrix's dashboard-url are
      # already correct when each is generated below.
      - name: Compute Pages URL
        id: pages-url
        run: echo "url=https://${{ github.repository_owner }}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_OUTPUT"

      - name: Run action against fixture run #2 (merges history)
        id: run2
        uses: ./
        with:
          allure-results-path: examples/sample-allure-results/run2
          output-path: allure-dashboard
          history-path: demo-history
          run-id: demo-run-2
          run-label: 'Demo Build #2'
          dashboard-title: 'Allure Dashboard — Live Demo'
          traceability-url: ${{ steps.pages-url.outputs.url }}traceability/

      - name: Assert outputs are correct
        run: |
          set -e
          test "${{ steps.run2.outputs.total }}" = "8"
          test "${{ steps.run2.outputs.passed }}" = "5"
          test "${{ steps.run2.outputs.failed }}" = "2"
          test "${{ steps.run2.outputs.flaky-count }}" = "2"
          test -f allure-dashboard/index.html
          test -f allure-dashboard/data/history.json
          test -f allure-dashboard/data/runs/demo-run-1.json
          test -f allure-dashboard/data/runs/demo-run-2.json
          node -e "const h=require('./allure-dashboard/data/history.json'); if (h.length !== 2) throw new Error('expected 2 history entries, got ' + h.length)"
          test -f allure-dashboard/data/attachments/demo-run-2/d452a8df-checkout-page-attachment.png
          test -f allure-dashboard/data/attachments/demo-run-2/fc13005e-teardown-screenshot-attachment.png
          node -e "
            const tests = require('./allure-dashboard/data/latest.json').tests;
            const t = tests.find((t) => t.name === 'should calculate tax correctly');
            if (!t || !t.steps || !t.steps.length) throw new Error('expected steps on should calculate tax correctly');
            if (!t.attachments || !t.attachments[0].path) throw new Error('expected a resolved attachment path');
            if (!t.steps.some((s) => s.attachments && s.attachments[0] && s.attachments[0].path)) throw new Error('expected a resolved step attachment path');
            const teardown = tests.find((t) => t.name === 'should apply discount code');
            const after = teardown && teardown.fixtures && teardown.fixtures.find((f) => f.phase === 'after');
            if (!after || !after.attachments[0] || !after.attachments[0].path) throw new Error('expected a resolved teardown-fixture attachment path');
          "
          node -e "
            const m = require('./allure-dashboard/data/meta.json');
            if (!m.traceabilityUrl || !m.traceabilityUrl.endsWith('/traceability')) throw new Error('expected the dashboard to carry a traceability link, got ' + m.traceabilityUrl);
          "
          echo "Dashboard self-test passed."

      # ---- Traceability matrix: same idea, its own fixture, own folder ----
      - name: Run traceability action against its fixture
        id: matrix
        uses: ./traceability
        with:
          allure-results-path: traceability/examples/sample-allure-results
          output-path: allure-dashboard/traceability
          requirement-annotation: requirement
          requirements-file: traceability/examples/requirements.csv
          dashboard-url: ${{ steps.pages-url.outputs.url }}
          title: 'Traceability Matrix — Live Demo'

      - name: Assert traceability outputs are correct
        run: |
          set -e
          test "${{ steps.matrix.outputs.total-requirements }}" = "4"
          test "${{ steps.matrix.outputs.covered-requirements }}" = "3"
          test "${{ steps.matrix.outputs.uncovered-requirements }}" = "1"
          test "${{ steps.matrix.outputs.failing-requirements }}" = "1"
          test "${{ steps.matrix.outputs.coverage-percent }}" = "50"
          test "${{ steps.matrix.outputs.orphan-tests }}" = "3"
          test -f allure-dashboard/traceability/index.html
          test -f allure-dashboard/traceability/traceability.csv
          test -f allure-dashboard/traceability/data/summary.json
          node -e "
            const d = require('./allure-dashboard/traceability/data/requirements.json');
            const req3 = d.requirements.find((r) => r.id === 'REQ-3');
            if (!req3 || req3.status !== 'not-covered') throw new Error('expected REQ-3 not-covered, got ' + JSON.stringify(req3));
            const req1 = d.requirements.find((r) => r.id === 'REQ-1');
            const link = req1 && req1.tests[0] && req1.tests[0].dashboardUrl;
            if (!link || !link.includes('#test=')) throw new Error('expected a dashboard deep link on REQ-1\\'s first test, got ' + link);
            const unknown = d.unknown.map((r) => r.id);
            if (!unknown.includes('REQ-99')) throw new Error('expected REQ-99 as an unknown requirement, got ' + JSON.stringify(unknown));
          "
          node -e "
            const s = require('./allure-dashboard/traceability/data/summary.json');
            const byName = Object.fromEntries(s.annotationCoverage.map((a) => [a.name, a]));
            if (byName.Epic.count !== 7) throw new Error('expected 7 tests tagged with epic, got ' + JSON.stringify(byName.Epic));
            if (byName.Requirement.count !== 5) throw new Error('expected 5 tests tagged with requirement, got ' + JSON.stringify(byName.Requirement));
            const story = s.byStory.find((g) => g.name === 'Invoice calculation');
            if (!story || story.total !== 2) throw new Error('expected story Invoice calculation to cover 2 requirements, got ' + JSON.stringify(story));
            const d = require('./allure-dashboard/traceability/data/requirements.json');
            const req1 = d.requirements.find((r) => r.id === 'REQ-1');
            if (!req1.groups || req1.groups.story.length !== 3) throw new Error('expected REQ-1 to resolve 3 distinct story values, got ' + JSON.stringify(req1 && req1.groups));
          "
          echo "Traceability self-test passed."

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: allure-dashboard

      - id: deployment
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/deploy-pages@v4
