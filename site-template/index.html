<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allure Dashboard</title>
<link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>
<div class="wrap" id="app">

  <div class="hero">
    <div>
      <h1 id="dash-title">Allure Dashboard</h1>
      <div class="sub" id="run-meta">Loading…</div>
    </div>
    <div class="hero-actions">
      <select id="run-picker" class="icon-btn" style="cursor:pointer;"></select>
      <button id="theme-toggle" class="icon-btn" title="Toggle light / dark">🌓 Theme</button>
    </div>
  </div>

  <div class="grid kpi-grid" id="kpi-grid"></div>

  <div class="grid wide-grid">
    <div class="card">
      <h2>Pass rate trend</h2>
      <div id="trend-passrate"></div>
    </div>
    <div class="card">
      <h2>Duration trend</h2>
      <div id="trend-duration"></div>
    </div>
  </div>

  <div class="grid charts-grid">
    <div class="card">
      <h2>Suites</h2>
      <div id="suite-bars"></div>
      <div class="legend" id="suite-legend"></div>
    </div>
    <div class="card">
      <h2>Severity</h2>
      <div id="severity-bars"></div>
    </div>
  </div>

  <div class="grid wide-grid">
    <div class="card">
      <h2>Failure categories</h2>
      <div id="categories"></div>
    </div>
    <div class="card">
      <h2>Flaky tests</h2>
      <div class="table-scroll">
        <table>
          <thead><tr><th>Test</th><th>Last status</th><th>Recent history</th><th></th></tr></thead>
          <tbody id="flaky-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="card" style="margin-bottom:16px;">
    <h2>Slowest tests</h2>
    <div class="table-scroll">
      <table>
        <thead><tr><th>Test</th><th>Status</th><th>Duration</th></tr></thead>
        <tbody id="slowest-body"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h2>All tests</h2>
    <div class="filters">
      <input type="search" id="test-search" placeholder="Search tests or suites…">
      <button class="filter-chip active" data-status="all">All</button>
      <button class="filter-chip" data-status="passed">Passed</button>
      <button class="filter-chip" data-status="failed">Failed</button>
      <button class="filter-chip" data-status="broken">Broken</button>
      <button class="filter-chip" data-status="skipped">Skipped</button>
      <button class="filter-chip" data-status="flaky">Flaky</button>
    </div>
    <div class="table-scroll">
      <table>
        <thead><tr><th>Test</th><th>Status</th><th>Severity</th><th>Duration</th><th></th></tr></thead>
        <tbody id="tests-body"></tbody>
      </table>
    </div>
  </div>

  <div class="footer">
    Generated by <a href="https://github.com/pranesh517/allure_dashboards" target="_blank" rel="noopener">allure-dashboard-action</a> from Allure raw results.
  </div>
</div>

<script type="module" src="./assets/js/app.js"></script>
</body>
</html>
